[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titirilquen_core"
version = "0.2.0"
description = "Núcleo científico del simulador Titirilquen — oferta, demanda y equilibrio de transporte sobre ciudad lineal monocéntrica"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Sebastian Acevedo" },
    { name = "Pablo Alvarez" },
    { name = "Fernando Castillo" },
    { name = "Angelo Guevara" },
]
# OJO con el piso de pydantic: NO lo suba sin verificar en el navegador.
# Pyodide 0.26.4 trae pydantic 2.7.0 precompilado, y el worker lo instala con
# `micropip.install("pydantic")` ANTES del wheel del core. Si el core pide una
# version mayor, micropip aborta con "Requested pydantic>=X, but pydantic==2.7.0
# is already installed" y el motor por defecto del simulador deja de arrancar.
# Ningun test lo detecta: todos corren en CPython. Paso en la fase F4 de la
# cirugia de agosto de 2026, al "alinear" versiones entre el core y la API.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titirilquen_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# Este es codigo de modelacion matematica y su notacion es parte de la
# documentacion. Sin estas excepciones `ruff check` emite ~100 avisos de ruido
# y deja de ser una senal: nadie lee un lint que siempre esta rojo.
ignore = [
    # α, β, ρ, λ, σ, − y ‖·‖ en docstrings y comentarios. Son los simbolos del
    # modelo (BPR, logit, bid-rent); reemplazarlos por ASCII haria la
    # documentacion mas dificil de cotejar con el Overleaf.
    "RUF001",
    "RUF002",
    "RUF003",
    # Nombres como S (oferta de vivienda), L (largo), N (poblacion), Q (matriz
    # de composicion), CBD, H (hogares). Son la notacion del paper y renombrarlos
    # a minusculas rompe la correspondencia con las ecuaciones.
    "N806",
    "N803",
    # Funciones cuyo nombre lleva un simbolo del modelo: _aggregate_T_expected,
    # test_coupled_T_matrix_shape, F (la CDF de Gumbel).
    "N802",
    # `I` como numero de celdas, en land_use. Es la notacion del paper. OJO:
    # esto tambien permite `l`, que si es mala practica — se confunde con 1.
    "E741",
]
