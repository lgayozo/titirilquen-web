name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Python (core + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: |
          uvx ruff check packages/titirilquen_core
          uvx ruff format --check packages/titirilquen_core
      - name: Pytest — core
        working-directory: packages/titirilquen_core
        run: uv run --extra dev pytest
      - name: Pytest — api
        working-directory: apps/api
        run: uv run --extra dev pytest

  contrato:
    name: Contrato generado al día
    runs-on: ubuntu-latest
    # El frontend deriva del núcleo tres artefactos versionados: el wheel que
    # instala Pyodide, los tipos/defaults/presets de `src/lib/gen/` y los
    # fixtures golden. Se commitean, así que pueden quedar viejos. Este job los
    # regenera y exige que no cambie nada: si cambia, alguien tocó el core sin
    # correr `npm run sync:core`.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Regenerar todo lo derivado del núcleo
        run: npm run sync:core --workspace @titirilquen/web
      - name: Exigir que no haya cambios
        run: |
          if ! git diff --exit-code --stat; then
            echo ""
            echo "::error::Hay artefactos derivados del núcleo sin regenerar."
            echo "Corré 'npm run sync:core' y commiteá el resultado junto al cambio del core."
            exit 1
          fi

  web:
    name: Web (typecheck + lint + build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @titirilquen/web
      - name: Lint
        run: npm run lint --workspace @titirilquen/web
      - name: Formato
        run: npm run format:check
      - name: Build (tsc + vite)
        run: npm run build --workspace @titirilquen/web
      - name: Instalar navegador Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E (rápido, excluye @slow que requiere CDN/Pyodide)
        working-directory: apps/web
        run: npm run test:e2e:fast

  pyodide:
    name: Pyodide arranca de verdad
    runs-on: ubuntu-latest
    # El motor POR DEFECTO de la app es Pyodide, y hasta ahora no lo tocaba
    # ningún job: los otros corren en CPython (pytest) o excluyen el test que
    # necesita CDN (`test:e2e:fast`). O sea que el runtime que usa cada alumno
    # era el único sin cobertura automática.
    #
    # No es hipotético. Alinear `pydantic>=2.8` en el núcleo dejó el motor sin
    # arrancar —Pyodide 0.26.4 trae 2.7.0 precompilado y `micropip` aborta con
    # "already installed"— con los 117 tests del core en verde. Lo que corre en
    # el navegador se verifica en el navegador.
    #
    # Va separado del job `web` a propósito: depende de un CDN externo
    # (jsdelivr), así que su modo de falla es distinto y conviene poder leerlo
    # sin confundirlo con un fallo de la app. `retries: 2` de la config de
    # Playwright cubre el parpadeo de red.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Instalar navegador Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Smoke del motor Pyodide (@slow, descarga el runtime del CDN)
        working-directory: apps/web
        run: npx playwright test --grep @slow
