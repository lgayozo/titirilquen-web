[project]
name = "impacto-rho"
version = "0.1.0"
description = "Que hace rho en la subasta de suelo, y en que rango la asignacion es realista"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    # Se compara el nucleo contra si mismo: las dos ramas salen de aca.
    "titirilquen-core",
    # E6 importa `tests/test_linea_base.py` para no duplicar el harness de la
    # corrida acoplada; ese modulo hace `import pytest` a nivel de modulo.
    "pytest>=8",
]

[tool.uv.sources]
titirilquen-core = { path = "../../packages/titirilquen_core" }

[tool.ruff]
line-length = 100
target-version = "py311"
