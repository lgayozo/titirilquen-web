[project]
name = "ibl-dia-a-dia"
version = "0.1.0"
description = "Eleccion modal dia a dia con aprendizaje por instancias (IBL): prototipo paralelo al MSA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    # Se reutilizan la utilidad, la oferta y el equilibrio MSA del nucleo.
    "titirilquen-core",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
titirilquen-core = { path = "../../packages/titirilquen_core" }

[tool.ruff]
line-length = 100
target-version = "py311"
