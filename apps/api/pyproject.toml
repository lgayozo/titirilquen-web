[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titirilquen_api"
version = "0.1.0"
description = "FastAPI wrapper del núcleo Titirilquen"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Atado al piso del core, que a su vez lo fija Pyodide (ver su pyproject).
    "pydantic>=2.7",
    "titirilquen_core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
titirilquen_core = { path = "../../packages/titirilquen_core", editable = true }

[tool.pytest.ini_options]
# Sin esto, `pytest` desde la raíz del monorepo no recoge estos tests: la
# config del core fija su propio testpaths y los de la API quedaban fuera.
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
# Misma configuración que el core: sin esto la API se lintea con los defaults
# (88 columnas) y el mismo código se formatea distinto según dónde viva.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# Este es codigo de modelacion matematica y su notacion es parte de la
# documentacion. Sin estas excepciones `ruff check` emite ~100 avisos de ruido
# y deja de ser una senal: nadie lee un lint que siempre esta rojo.
ignore = [
    # α, β, ρ, λ, σ, − y ‖·‖ en docstrings y comentarios. Son los simbolos del
    # modelo (BPR, logit, bid-rent); reemplazarlos por ASCII haria la
    # documentacion mas dificil de cotejar con el Overleaf.
    "RUF001",
    "RUF002",
    "RUF003",
    # Nombres como S (oferta de vivienda), L (largo), N (poblacion), Q (matriz
    # de composicion), CBD, H (hogares). Son la notacion del paper y renombrarlos
    # a minusculas rompe la correspondencia con las ecuaciones.
    "N806",
    "N803",
]
